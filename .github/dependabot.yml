version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels: [dependencies, internal, github_actions]
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Python uv
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels: [dependencies, internal]
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Bun
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels: [dependencies, internal]
    ignore:
      - dependency-name: "@hey-api/openapi-ts"
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Docker images
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Docker Compose images
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      docker-compose-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Pre-commit hooks
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels: [dependencies, internal, pre-commit]
    groups:
      pre-commit-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
